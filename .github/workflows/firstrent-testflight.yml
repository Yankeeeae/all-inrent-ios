name: FIRST RENT TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: App FIRST RENT à envoyer sur TestFlight
        type: choice
        options:
          - client
          - pro
        required: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout FIRST RENT
        uses: actions/checkout@v5
        with:
          repository: Yankeeeae/first-rent-ios
          ref: main
          path: first-rent-ios

      - name: Choose the app
        id: app
        run: |
          if [ "${{ inputs.app }}" = "pro" ]; then
            echo "dir=first-rent-ios/ios-pro" >> "$GITHUB_OUTPUT"
            echo "plist=FIRSTRENTPRO/Info.plist" >> "$GITHUB_OUTPUT"
          else
            echo "dir=first-rent-ios/ios" >> "$GITHUB_OUTPUT"
            echo "plist=FIRSTRENT/Info.plist" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write App Store Connect API key
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Install Fastlane
        run: sudo gem install fastlane --no-document

      - name: Create the App Store Connect app
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/${{ steps.app.outputs.dir }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: fastlane bootstrap

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "${{ steps.app.outputs.plist }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "${{ steps.app.outputs.plist }}"
          plutil -p "${{ steps.app.outputs.plist }}" | grep CFBundle

      - name: Write signing certificate
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          DIST_CERT_CER_BASE64: ${{ secrets.DIST_CERT_CER_BASE64 }}
          DIST_CERT_KEY_BASE64: ${{ secrets.DIST_CERT_KEY_BASE64 }}
        run: |
          echo "$DIST_CERT_CER_BASE64" | base64 --decode > dist.cer
          echo "$DIST_CERT_KEY_BASE64" | base64 --decode > dist.key
          openssl x509 -inform DER -in dist.cer -out dist.pem
          openssl pkcs12 -export -inkey dist.key -in dist.pem -out ios_distribution.p12 -passout pass:allinrent-ci

      - name: Build and upload to TestFlight
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/${{ steps.app.outputs.dir }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          P12_PATH: ${{ github.workspace }}/${{ steps.app.outputs.dir }}/ios_distribution.p12
          P12_PASSWORD: allinrent-ci
        run: fastlane release
