name: iOS App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 25" ALLINRENT/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ALLINRENT/Info.plist
          plutil -p ALLINRENT/Info.plist | grep CFBundle

      - name: Install Fastlane
        run: brew install fastlane

      - name: Write signing certificate
        env:
          DIST_CERT_CER_BASE64: ${{ secrets.DIST_CERT_CER_BASE64 }}
          DIST_CERT_KEY_BASE64: ${{ secrets.DIST_CERT_KEY_BASE64 }}
        run: |
          echo "$DIST_CERT_CER_BASE64" | base64 --decode > dist.cer
          echo "$DIST_CERT_KEY_BASE64" | base64 --decode > dist.key
          openssl x509 -inform DER -in dist.cer -out dist.pem
          openssl pkcs12 -export -inkey dist.key -in dist.pem -out ios_distribution.p12 -passout pass:allinrent-ci

      - name: Build and upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/ios/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          P12_PATH: ${{ github.workspace }}/ios/ios_distribution.p12
          P12_PASSWORD: allinrent-ci
        run: fastlane release
