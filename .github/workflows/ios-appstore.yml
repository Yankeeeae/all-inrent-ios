name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Soumettre à la review App Store après TestFlight
        type: boolean
        default: true
      skip_binary:
        description: Ne pas recompiler (soumettre le build TestFlight déjà uploadé)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        if: ${{ inputs.skip_binary != true }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        if: ${{ inputs.skip_binary != true }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture App Store screenshots
        if: ${{ inputs.skip_binary != true }}
        working-directory: ios/fastlane
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
          node capture-screenshots.mjs

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p private_keys
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Install XcodeGen
        if: ${{ inputs.skip_binary != true }}
        run: brew install xcodegen

      - name: Generate Xcode project
        if: ${{ inputs.skip_binary != true }}
        run: |
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 29" ALLINRENT/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" ALLINRENT/Info.plist
          plutil -p ALLINRENT/Info.plist | grep CFBundle

      - name: Install Fastlane
        run: sudo gem install fastlane --no-document

      - name: Write signing certificate
        if: ${{ inputs.skip_binary != true }}
        env:
          DIST_CERT_CER_BASE64: ${{ secrets.DIST_CERT_CER_BASE64 }}
          DIST_CERT_KEY_BASE64: ${{ secrets.DIST_CERT_KEY_BASE64 }}
        run: |
          echo "$DIST_CERT_CER_BASE64" | base64 --decode > dist.cer
          echo "$DIST_CERT_KEY_BASE64" | base64 --decode > dist.key
          openssl x509 -inform DER -in dist.cer -out dist.pem
          openssl pkcs12 -export -inkey dist.key -in dist.pem -out ios_distribution.p12 -passout pass:allinrent-ci

      - name: App Store Connect status
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/ios/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: fastlane status
        continue-on-error: true

      - name: Build, TestFlight and submit
        if: ${{ inputs.skip_binary != true }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/ios/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          P12_PATH: ${{ github.workspace }}/ios/ios_distribution.p12
          P12_PASSWORD: allinrent-ci
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: fastlane release

      - name: Set App Store free price
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/ios/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: node fastlane/set-free-price.mjs

      - name: Submit existing TestFlight build
        if: ${{ inputs.skip_binary == true }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/ios/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: fastlane submit_review
