name: ALLINRENT
options:
  bundleIdPrefix: com.allinrent
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 59GW7X6RA6
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.allinrent.app
targets:
  ALLINRENT:
    type: application
    platform: iOS
    sources:
      - path: ALLINRENT
    settings:
      base:
        INFOPLIST_FILE: ALLINRENT/Info.plist
        CODE_SIGN_ENTITLEMENTS: ALLINRENT/ALLINRENT.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "20"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: ALLINRENT/ALLINRENT.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:www.all-inrent.com
          - applinks:all-inrent.com
    scheme:
      gatherCoverageData: false
